# Prometheus will be deployed via kube-prometheus-stack Helm chart
# This file documents custom scrape configs

# ServiceMonitor for app microservices
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: microservices
  namespace: monitoring
  labels:
    release: prometheus  # Required for kube-prometheus-stack to discover this
spec:
  namespaceSelector:
    matchNames:
      - apps
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: Helm
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
