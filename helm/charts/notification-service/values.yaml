replicaCount: 2

image:
  repository: ""  # Set by CI (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/devsecops-aws/auth-service)
  tag: ""         # Set by CI (e.g., sha-a1b2c3d)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8083

serviceAccount:
  annotations: {}
  # For IRSA, set in environment values:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/auth-service-role

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70